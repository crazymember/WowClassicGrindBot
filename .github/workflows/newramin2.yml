# This workflow will build your .NET application
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore NuGet packages
      run: |
        nuget sources Add -Name nuget.org -Source https://api.nuget.org/v3/index.json
        nuget restore MasterOfPuppets.sln -Source https://api.nuget.org/v3/index.json
    
    - name: Build the application
      run: msbuild MasterOfPuppets.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
    
    - name: Run tests (if tests exist)
      run: dotnet test --no-build --verbosity normal --configuration Release
      continue-on-error: true
