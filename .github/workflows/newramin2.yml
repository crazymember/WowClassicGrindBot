# This workflow will build your .NET application
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Add NuGet package source if needed
      run: dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget.org
    
    - name: Restore packages
      run: dotnet restore MasterOfPuppets.sln --source https://api.nuget.org/v3/index.json
    
    - name: Build the application
      run: msbuild MasterOfPuppets.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU"
    
    - name: Run tests (if tests exist)
      run: dotnet test --no-build --verbosity normal --configuration Release
      continue-on-error: true
